<svg width="1600" height="360" viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gustavo Izidoro, desenvolvedor de software em formação">
  <title>Gustavo Izidoro, desenvolvedor de software em formação</title>
  <defs>
    <!-- barra de título Aero -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6fd"/>
      <stop offset="18%" stop-color="#bfe0fb"/>
      <stop offset="48%" stop-color="#7cb8ec"/>
      <stop offset="100%" stop-color="#3f7dc4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f9ff"/>
      <stop offset="100%" stop-color="#c3ddf5"/>
    </linearGradient>
    <linearGradient id="closebtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a9a"/>
      <stop offset="100%" stop-color="#d13b3b"/>
    </linearGradient>

    <!-- céu da aurora -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071a3a"/>
      <stop offset="55%" stop-color="#0d3a6b"/>
      <stop offset="100%" stop-color="#11618f"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e97b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#43e97b" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b388ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8f7cff" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#00c9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00c9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#bfefff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7fd8ff" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b3a5c" flood-opacity="0.45"/>
    </filter>

    <clipPath id="bodyclip"><path d="M2,60 H1598 V340 A18,18 0 0 1 1580,358 H20 A18,18 0 0 1 2,340 Z"/></clipPath>
    <clipPath id="barclip"><path d="M20,2 H1580 A20,20 0 0 1 1598,22 V60 H2 V22 A20,20 0 0 1 20,2 Z"/></clipPath>
  </defs>

  <style>
    .ra   { animation: driftA 14s ease-in-out infinite alternate; }
    .rb   { animation: driftB 18s ease-in-out infinite alternate; }
    .rc   { animation: driftA 22s ease-in-out -6s infinite alternate-reverse; }
    .pulse{ animation: pulse 7s ease-in-out infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .bub  { animation: rise linear infinite; }
    .shine{ animation: sweep 7s ease-in-out 1s infinite; }
    .pill { opacity: 0; animation: pop 0.6s ease-out forwards; }
    .fade { opacity: 0; animation: pop 0.8s ease-out forwards; }
    @keyframes driftA { from { transform: translate(-80px, 0) scaleY(1); }   to { transform: translate(80px, -14px) scaleY(1.15); } }
    @keyframes driftB { from { transform: translate(90px, 6px); }            to { transform: translate(-90px, -10px); } }
    @keyframes pulse  { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes twinkle{ 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    @keyframes rise   { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-330px); opacity: 0; } }
    @keyframes sweep  { 0% { transform: translateX(-400px); } 35%, 100% { transform: translateX(2000px); } }
    @keyframes pop    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>

  <!-- moldura -->
  <g filter="url(#shadow)">
    <path d="M20,2 H1580 A20,20 0 0 1 1598,22 V340 A18,18 0 0 1 1580,358 H20 A18,18 0 0 1 2,340 V22 A20,20 0 0 1 20,2 Z" fill="url(#sky)"/>
  </g>

  <!-- aurora -->
  <g clip-path="url(#bodyclip)">
    <rect x="0" y="60" width="1600" height="300" fill="url(#sky)"/>

    <g fill="#ffffff">
      <circle class="star" cx="140" cy="92"  r="1.6" style="animation-delay:0s"/>
      <circle class="star" cx="330" cy="140" r="1.2" style="animation-delay:1.1s"/>
      <circle class="star" cx="520" cy="84"  r="1.4" style="animation-delay:2.0s"/>
      <circle class="star" cx="1080" cy="96" r="1.5" style="animation-delay:0.6s"/>
      <circle class="star" cx="1270" cy="150" r="1.2" style="animation-delay:1.7s"/>
      <circle class="star" cx="1460" cy="88" r="1.6" style="animation-delay:2.4s"/>
      <circle class="star" cx="760"  cy="78" r="1.1" style="animation-delay:1.4s"/>
    </g>

    <g filter="url(#blur)">
      <g class="ra"><path class="pulse" d="M-100,210 C200,120 420,260 760,170 S1300,110 1700,190 L1700,250 C1300,170 1000,280 760,230 S200,190 -100,270 Z" fill="url(#ribbonA)"/></g>
      <g class="rb"><path class="pulse" style="animation-delay:-3s" d="M-100,150 C260,90 520,190 860,120 S1400,80 1700,130 L1700,175 C1400,130 1100,220 860,170 S260,140 -100,200 Z" fill="url(#ribbonB)"/></g>
      <g class="rc"><path d="M-100,300 C300,250 600,330 900,280 S1400,250 1700,300 L1700,360 L-100,360 Z" fill="#43e97b" fill-opacity="0.25"/></g>
    </g>

    <!-- bolhas -->
    <g>
      <circle class="bub" cx="110"  cy="380" r="14" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:11s;animation-delay:0s"/>
      <circle class="bub" cx="260"  cy="390" r="8"  fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:9s;animation-delay:-4s"/>
      <circle class="bub" cx="1340" cy="385" r="12" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:12s;animation-delay:-2s"/>
      <circle class="bub" cx="1490" cy="390" r="18" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:14s;animation-delay:-7s"/>
      <circle class="bub" cx="1210" cy="395" r="7"  fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:8s;animation-delay:-5s"/>
      <circle class="bub" cx="400"  cy="395" r="10" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.5" style="animation-duration:13s;animation-delay:-9s"/>
    </g>
  </g>

  <!-- painel de vidro central -->
  <g class="fade" style="animation-delay:0.1s">
    <rect x="330" y="92" width="940" height="236" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="340" y="98" width="920" height="60" rx="22" fill="url(#glassTop)"/>
    <text x="800" y="180" text-anchor="middle" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff" filter="url(#glow)">Gustavo Izidoro</text>
    <text x="800" y="224" text-anchor="middle" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="27" font-weight="400" fill="#d6f4ff">Desenvolvedor de software em formação  ·  Software + IA aplicada</text>
  </g>

  <!-- pílulas de vidro -->
  <g class="pill" style="animation-delay:0.5s">
    <rect x="465" y="254" width="200" height="42" rx="21" fill="url(#pillGlass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="473" y="257" width="184" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="565" y="282" text-anchor="middle" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Python · Django</text>
  </g>
  <g class="pill" style="animation-delay:0.75s">
    <rect x="685" y="254" width="250" height="42" rx="21" fill="url(#pillGlass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="693" y="257" width="234" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="810" y="282" text-anchor="middle" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">React · React Native</text>
  </g>
  <g class="pill" style="animation-delay:1s">
    <rect x="955" y="254" width="180" height="42" rx="21" fill="url(#pillGlass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
    <rect x="963" y="257" width="164" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.35"/>
    <text x="1045" y="282" text-anchor="middle" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">SDD + IA</text>
  </g>

  <!-- barra de título -->
  <path d="M20,2 H1580 A20,20 0 0 1 1598,22 V60 H2 V22 A20,20 0 0 1 20,2 Z" fill="url(#bar)"/>
  <path d="M20,2 H1580 A20,20 0 0 1 1598,22 V26 H2 V22 A20,20 0 0 1 20,2 Z" fill="url(#gloss)"/>
  <g clip-path="url(#barclip)"><rect class="shine" x="0" y="0" width="140" height="60" fill="#ffffff" fill-opacity="0.35" transform="skewX(-20)"/></g>
  <line x1="0" y1="60" x2="1600" y2="60" stroke="#2f5f92" stroke-width="1.5"/>
  <path d="M20,2 H1580 A20,20 0 0 1 1598,22 V340 A18,18 0 0 1 1580,358 H20 A18,18 0 0 1 2,340 V22 A20,20 0 0 1 20,2 Z" fill="none" stroke="#2f5f92" stroke-width="2.5"/>

  <circle cx="42" cy="31" r="11" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="42" cy="31" r="5" fill="#2f5f92" fill-opacity="0.55"/>
  <text x="66" y="39" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="20" font-weight="500" fill="#0f2b4c">perfil-gustavo-izidoro.exe</text>
  <g>
    <rect x="1414" y="12" width="40" height="40" rx="6" fill="url(#btn)" stroke="#6f9fca" stroke-width="1.2"/>
    <line x1="1424" y1="40" x2="1442" y2="40" stroke="#1c3f66" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="1466" y="12" width="40" height="40" rx="6" fill="url(#btn)" stroke="#6f9fca" stroke-width="1.2"/>
    <rect x="1476" y="22" width="20" height="20" fill="none" stroke="#1c3f66" stroke-width="2.5"/>
    <rect x="1518" y="12" width="40" height="40" rx="6" fill="url(#closebtn)" stroke="#8a1f1f" stroke-width="1.2"/>
    <line x1="1529" y1="23" x2="1545" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="1545" y1="23" x2="1529" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
