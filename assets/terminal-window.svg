<svg width="1600" height="430" viewBox="0 0 1600 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal de boot do perfil">
  <title>Terminal de boot do perfil</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6fd"/>
      <stop offset="18%" stop-color="#bfe0fb"/>
      <stop offset="48%" stop-color="#7cb8ec"/>
      <stop offset="100%" stop-color="#3f7dc4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f9ff"/>
      <stop offset="100%" stop-color="#c3ddf5"/>
    </linearGradient>
    <linearGradient id="closebtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a9a"/>
      <stop offset="100%" stop-color="#d13b3b"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#43e97b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b3a5c" flood-opacity="0.4"/>
    </filter>
    <filter id="tblur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="tbody"><path d="M2,60 H1598 V412 A16,16 0 0 1 1582,428 H18 A16,16 0 0 1 2,412 Z"/></clipPath>
    <clipPath id="progclip">
      <rect x="48" y="146" width="560" height="22" rx="11"/>
    </clipPath>
  </defs>

  <style>
    .t   { font-family: Consolas, Menlo, monospace; font-size: 21px; }
    .ln  { opacity: 0; animation: show 0.25s ease-out forwards; }
    .fill { transform: scaleX(0); transform-origin: 48px 0; animation: grow 1.6s ease-in-out 0.6s forwards; }
    .cur { animation: blink 1s steps(1) 4.6s infinite; opacity: 0; }
    .aur { animation: aur 16s ease-in-out infinite alternate; }
    @keyframes aur { from { transform: translateX(-120px); opacity: 0.35; } to { transform: translateX(120px); opacity: 0.7; } }
    @keyframes show  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes grow  { to { transform: scaleX(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <g filter="url(#shadow)">
    <path d="M16,2 H1584 A16,16 0 0 1 1598,18 V428 H2 V18 A16,16 0 0 1 16,2 Z" fill="url(#body)" stroke="#2f5f92" stroke-width="2.5"/>
  </g>
  <g clip-path="url(#tbody)" filter="url(#tblur)">
    <path class="aur" d="M-100,420 C300,350 700,440 1000,380 S1500,360 1700,400 L1700,470 L-100,470 Z" fill="#00f2fe" fill-opacity="0.35"/>
    <path class="aur" style="animation-delay:-8s" d="M-100,440 C400,390 800,460 1200,410 S1600,420 1700,430 L1700,480 L-100,480 Z" fill="#43e97b" fill-opacity="0.3"/>
  </g>
  <path d="M16,2 H1584 A16,16 0 0 1 1598,18 V60 H2 V18 A16,16 0 0 1 16,2 Z" fill="url(#bar)"/>
  <path d="M16,2 H1584 A16,16 0 0 1 1598,18 V26 H2 V18 A16,16 0 0 1 16,2 Z" fill="url(#gloss)"/>
  <line x1="0" y1="60" x2="1600" y2="60" stroke="#2f5f92" stroke-width="1.5"/>
  <circle cx="42" cy="31" r="11" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="42" cy="31" r="5" fill="#2f5f92" fill-opacity="0.55"/>
  <text x="66" y="39" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f2b4c">Boot Sequence</text>
  <g>
    <rect x="1414" y="12" width="40" height="40" rx="6" fill="url(#btn)" stroke="#6f9fca" stroke-width="1.2"/>
    <line x1="1424" y1="40" x2="1442" y2="40" stroke="#1c3f66" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="1466" y="12" width="40" height="40" rx="6" fill="url(#btn)" stroke="#6f9fca" stroke-width="1.2"/>
    <rect x="1476" y="22" width="20" height="20" fill="none" stroke="#1c3f66" stroke-width="2.5"/>
    <rect x="1518" y="12" width="40" height="40" rx="6" fill="url(#closebtn)" stroke="#8a1f1f" stroke-width="1.2"/>
    <line x1="1529" y1="23" x2="1545" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="1545" y1="23" x2="1529" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text class="t ln" x="48" y="110" fill="#7cd6ff" style="animation-delay:0.1s">C:\SYSTEM32&gt; booting_gustavo_profile.exe</text>

  <!-- barra de progresso -->
  <g class="ln" style="animation-delay:0.4s">
    <rect x="48" y="146" width="560" height="22" rx="11" fill="#0d2236" stroke="#2f5f92" stroke-width="1.5"/>
    <g clip-path="url(#progclip)">
      <rect class="fill" x="48" y="146" width="560" height="22" fill="url(#prog)"/>
      <rect class="fill" x="48" y="147" width="560" height="8" fill="#ffffff" fill-opacity="0.35"/>
    </g>
    <text class="t" x="628" y="164" fill="#5ee89a">100%</text>
  </g>

  <text class="t ln" x="48" y="220" fill="#e8f0f7" style="animation-delay:2.3s">&gt; Carregando Python + Django........ <tspan fill="#5ee89a">[ OK ]</tspan></text>
  <text class="t ln" x="48" y="252" fill="#e8f0f7" style="animation-delay:2.7s">&gt; Carregando React + React Native... <tspan fill="#5ee89a">[ OK ]</tspan></text>
  <text class="t ln" x="48" y="284" fill="#e8f0f7" style="animation-delay:3.1s">&gt; Lendo specs (SDD)................. <tspan fill="#5ee89a">[ OK ]</tspan></text>
  <text class="t ln" x="48" y="316" fill="#e8f0f7" style="animation-delay:3.5s">&gt; Conectando Claude + Copilot....... <tspan fill="#5ee89a">[ OK ]</tspan></text>
  <text class="t ln" x="48" y="370" fill="#5ee89a" style="animation-delay:4.1s">Sistema pronto. Aberto a oportunidades de estágio.</text>
  <rect class="cur" x="692" y="352" width="13" height="24" fill="#5ee89a"/>
</svg>
